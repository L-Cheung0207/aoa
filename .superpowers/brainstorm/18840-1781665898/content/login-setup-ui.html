<h2>LoginSetupPage：向导壳 UI</h2>
<p class="subtitle">复用截图结构：顶部步骤条，主体登录卡片，底部主按钮。登录成功后才进入设置/体验/就绪。</p>

<div class="mockup">
  <div class="mockup-header">登录步骤草图</div>
  <div class="mockup-body" style="background:#efefef;padding:18px;border-radius:8px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:26px">
      <strong>Voice Assistant 安装向导</strong>
      <span style="font-size:22px;color:#777">－ ×</span>
    </div>
    <div style="display:flex;justify-content:center;gap:24px;margin-bottom:24px;color:#8b8b8b">
      <span style="color:#2f80ed">● 登录</span><span>››</span>
      <span>○ 设置</span><span>››</span>
      <span>○ 体验</span><span>››</span>
      <span>○ 就绪</span>
    </div>
    <div style="background:white;border-radius:10px;padding:28px 32px;height:350px">
      <div style="display:flex;gap:28px;align-items:baseline;margin-bottom:22px">
        <h3 style="font-size:24px;margin:0;color:#111">登入您的账户</h3>
        <strong style="color:#666">使用 AD 域登入</strong>
      </div>
      <p style="color:#555;margin-bottom:46px">使用邮箱 + 验证码快速登录，云端同步配置与历史。</p>
      <div style="display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center;max-width:760px">
        <label>电子邮箱</label>
        <input class="mock-input" placeholder="your@company.com">
        <label>验证码</label>
        <div style="display:grid;grid-template-columns:1fr 130px;gap:8px">
          <input class="mock-input" placeholder="验证码">
          <button class="mock-button">发送验证码</button>
        </div>
      </div>
      <p style="margin-left:130px;margin-top:18px;color:#666">请在160秒内输入验证码。</p>
    </div>
    <div style="display:flex;justify-content:flex-end;margin-top:18px">
      <button class="mock-button" style="background:#2f80ed;color:white;border-color:#2f80ed;border-radius:22px;padding:12px 38px">登录 →</button>
    </div>
  </div>
</div>
