<!doctype html><html><head><meta charset="utf-8"><style>.login-setup {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  color: #111827;
  background: #eeeeee;
}

.login-setup__chrome {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 52px;
  padding: 0 16px;
  box-sizing: border-box;
  -webkit-app-region: drag;
}

.login-setup__brand {
  color: #4b5563;
  font-size: 13px;
  font-weight: 650;
}

.login-setup__window-controls {
  display: flex;
  gap: 8px;
  -webkit-app-region: no-drag;
}

.login-setup__window-button {
  display: grid;
  width: 34px;
  height: 30px;
  place-items: center;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.login-setup__window-button:hover {
  background: rgba(17, 24, 39, 0.08);
}

.login-setup__window-button--close:hover {
  background: rgba(220, 38, 38, 0.12);
}

.login-setup__window-button-minimize,
.login-setup__window-button-close {
  position: relative;
  display: block;
  width: 16px;
  height: 16px;
}

.login-setup__window-button-minimize::before {
  position: absolute;
  right: 1px;
  bottom: 4px;
  left: 1px;
  height: 2px;
  content: "";
  background: #737373;
}

.login-setup__window-button-close::before,
.login-setup__window-button-close::after {
  position: absolute;
  top: 7px;
  left: 1px;
  width: 15px;
  height: 2px;
  content: "";
  background: #737373;
}

.login-setup__window-button-close::before {
  transform: rotate(45deg);
}

.login-setup__window-button-close::after {
  transform: rotate(-45deg);
}

.login-setup__shell {
  position: relative;
  z-index: 1;
  display: flex;
  min-height: calc(100vh - 52px);
  flex-direction: column;
  align-items: center;
  padding: 16px 28px 22px;
  box-sizing: border-box;
}

.login-setup--wizard .login-setup__shell {
  padding: 0 14px 18px;
}

.login-setup--login .login-setup__shell {
  padding: 0 22px 70px;
}

.login-setup__mark {
  width: 80px;
  height: 60px;
}

.login-setup__mark .themed-icon {
  width: 100%;
  height: 100%;
}

.login-setup__heading {
  margin-top: 10px;
  text-align: center;
}

.login-setup--wizard .login-setup__heading {
  display: none;
}

.login-setup--login .login-setup__heading {
  display: none;
}

.login-setup__eyebrow {
  margin: 0;
  color: #667085;
  font-size: 13px;
  font-weight: 600;
}

.login-setup__heading h1 {
  margin: 7px 0 0;
  color: #111827;
  font-size: 22px;
  font-weight: 760;
  letter-spacing: 0;
}

.login-setup__steps {
  display: flex;
  align-items: center;
  justify-content: center;
  width: min(440px, calc(100vw - 72px));
  gap: 30px;
  margin: 22px 0 16px;
  padding: 0;
  list-style: none;
}

.login-setup--wizard .login-setup__steps {
  margin: 0 0 14px;
}

.login-setup--login .login-setup__steps {
  margin: 0 0 24px;
}

.login-setup__step {
  position: relative;
  display: flex;
  min-width: 0;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 24px;
  color: #6b7280;
  font-size: 12px;
  font-weight: 650;
}

.login-setup__step:not(:last-child)::before {
  position: absolute;
  top: 50%;
  right: -22px;
  color: #a3a3a3;
  font-size: 31px;
  font-weight: 600;
  line-height: 1;
  content: "";
  transform: translateY(-53%);
}

.login-setup__step:not(:last-child)::after {
  position: absolute;
  top: 50%;
  right: -31px;
  color: #a3a3a3;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
  line-height: 1;
  content: ">>";
  transform: translateY(-50%);
}

.login-setup__step span {
  display: grid;
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  place-items: center;
  color: transparent;
  font-size: 0;
  border: 0;
  border-radius: 50%;
  background: #dedede;
}

.login-setup__step span::before {
  color: #787878;
  font-size: 12px;
  line-height: 1;
  content: "✓";
}

.login-setup__step:nth-child(1) span::before {
  content: "◎";
}

.login-setup__step:nth-child(2) span::before {
  content: "⚙";
}

.login-setup__step:nth-child(3) span::before {
  content: "♡";
}

.login-setup__step--complete,
.login-setup__step--current {
  color: #1f2937;
}

.login-setup__step--complete span {
  color: #fff;
  background: #2dbd5f;
}

.login-setup__step--current span {
  color: #fff;
  background: #2f80ed;
}

.login-setup__step--complete span::before,
.login-setup__step--current span::before {
  color: #fff;
}

.login-setup__step--complete:not(:last-child)::after,
.login-setup__step--current:not(:last-child)::after {
  color: #242424;
}

.login-setup__panel {
  display: flex;
  width: min(560px, calc(100vw - 72px));
  min-height: 250px;
  flex-direction: column;
  padding: 24px 28px 22px;
  box-sizing: border-box;
  overflow: hidden;
  border: 1px solid rgba(17, 24, 39, 0.06);
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 14px 36px rgba(17, 24, 39, 0.08);
}

.login-setup--wizard .login-setup__panel {
  width: min(920px, calc(100vw - 28px));
  min-height: min(418px, calc(100vh - 184px));
  flex: 1;
  padding: 0;
  border: 0;
  box-shadow: none;
}

.login-setup--login .login-setup__panel {
  width: min(794px, calc(100vw - 44px));
  min-height: min(418px, calc(100vh - 164px));
  padding: 24px 26px;
  border: 0;
  box-shadow: none;
}

.login-setup__login-header {
  display: flex;
  align-items: baseline;
  gap: 24px;
}

.login-setup__login-header h2 {
  margin: 0;
  color: #111;
  font-size: 23px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: 0;
}

.login-setup__login-intro {
  margin: 25px 0 0;
  color: #3f3f46;
  font-size: 13px;
  line-height: 1.6;
}

.login-setup__mode-tabs {
  display: flex;
  align-items: center;
  gap: 22px;
}

.login-setup__mode-tab {
  height: auto;
  padding: 0;
  color: #3f3f46;
  font: inherit;
  font-size: 14px;
  font-weight: 650;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.login-setup__mode-tab--active {
  color: #111827;
}

.login-setup__form {
  display: grid;
  gap: 15px;
  width: min(604px, calc(100% - 120px));
  margin: 62px auto 0;
}

.login-setup__field {
  display: grid;
  grid-template-columns: 56px minmax(0, 1fr);
  align-items: center;
  gap: 18px;
  color: #202020;
  font-size: 13px;
  font-weight: 700;
}

.login-setup__field small {
  grid-column: 2;
  margin-top: 4px;
  color: #3f3f46;
  font-size: 12px;
  font-weight: 500;
}

.login-setup__field input {
  width: 100%;
  min-width: 0;
  height: 44px;
  padding: 0 18px;
  box-sizing: border-box;
  color: #111827;
  font: inherit;
  font-size: 14px;
  border: 0;
  border-radius: 7px;
  outline: none;
  background: #e9e9e9;
}

.login-setup__field input:focus {
  box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.14);
}

.login-setup__code-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 104px;
  gap: 8px;
}

.login-setup__form-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-top: 20px;
}

.login-setup--login .login-setup__form-footer {
  position: fixed;
  right: 34px;
  bottom: 45px;
  left: 34px;
  justify-content: flex-end;
}

.login-setup--login .login-setup__check {
  display: none;
}

.login-setup__check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: #344054;
  font-size: 14px;
  line-height: 1;
}

.login-setup__check input {
  width: 15px;
  height: 15px;
  accent-color: #2f80ed;
}

.login-setup__primary,
.login-setup__secondary {
  font: inherit;
  font-weight: 700;
  border: 0;
  cursor: pointer;
}

.login-setup__primary {
  display: inline-flex;
  min-width: 128px;
  height: 42px;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 0 24px;
  color: #fff;
  border-radius: 21px;
  background: #2f80ed;
  box-shadow: 0 8px 18px rgba(47, 128, 237, 0.23);
}

.login-setup__primary:hover:not(:disabled) {
  background: #2672dc;
}

.login-setup--login .login-setup__primary {
  min-width: 148px;
  height: 39px;
  border-radius: 20px;
  font-size: 16px;
}

.login-setup__primary-arrow {
  font-size: 26px;
  font-weight: 500;
  line-height: 1;
}

.login-setup__primary--wide {
  display: inline-flex;
  min-width: 160px;
  height: 46px;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border-radius: 23px;
  font-size: 15px;
}

.login-setup__secondary {
  height: 44px;
  padding: 0 14px;
  color: #1f2937;
  border-radius: 7px;
  border: 1px solid #a9a9a9;
  background: #f6f6f6;
}

.login-setup__secondary:hover:not(:disabled) {
  background: #c8c8c8;
}

.login-setup__primary:disabled,
.login-setup__secondary:disabled {
  cursor: not-allowed;
  opacity: 0.45;
  box-shadow: none;
}

.login-setup__wizard-content {
  flex: 1;
  min-height: 0;
}

.login-setup__copy-page,
.login-setup__microphone-page,
.login-setup__ready-page {
  min-height: min(418px, calc(100vh - 184px));
  box-sizing: border-box;
  padding: 25px 26px;
}

.login-setup__copy-page h2,
.login-setup__microphone-page h2,
.login-setup__ready-page h2 {
  margin: 0;
  color: #111827;
  font-size: 24px;
  font-weight: 800;
  line-height: 1.3;
  letter-spacing: 0;
}

.login-setup__copy-list {
  display: grid;
  gap: 24px;
  margin-top: 28px;
}

.login-setup__info-block {
  max-width: 520px;
}

.login-setup__info-block h3 {
  margin: 0 0 6px;
  color: #171717;
  font-size: 13px;
  font-weight: 800;
}

.login-setup__info-block p {
  margin: 0;
  color: #667085;
  font-size: 12px;
  line-height: 1.55;
}

.login-setup__permission-consent {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-top: 24px;
  color: #3f3f46;
  font-size: 13px;
}

.login-setup__permission-consent span {
  color: #3f3f46;
  font-size: 13px;
}

.login-setup__microphone-page {
  position: relative;
  display: flex;
  flex-direction: column;
}

.login-setup__microphone-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
}

.login-setup__microphone-header p {
  margin: 14px 0 0;
  color: #52525b;
  font-size: 13px;
  line-height: 1.6;
}

.login-setup__device-link {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 52px;
  padding: 0;
  color: #202020;
  font: inherit;
  font-size: 12px;
  font-weight: 650;
  text-decoration: underline;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.login-setup__microphone-meter {
  display: grid;
  flex: 1;
  place-items: center;
  align-content: center;
  gap: 18px;
  padding-bottom: 54px;
  text-align: center;
}

.login-setup__microphone-meter .mic-level-meter {
  padding: 15px 18px;
  border: 0;
  border-radius: 9px;
  background: #e6e6e6;
  box-shadow: none;
}

.login-setup__microphone-meter .mic-level-meter__bar {
  width: 5px;
  height: 21px;
}

.login-setup__microphone-meter strong {
  color: #222;
  font-size: 13px;
  font-weight: 650;
}

.login-setup__microphone-meter p {
  max-width: 440px;
  margin: 0;
  color: #b42318;
  font-size: 12px;
}

.login-setup__ready-page {
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  text-align: center;
}

.login-setup__ready-page p {
  max-width: 460px;
  margin: 0;
  color: #667085;
  font-size: 14px;
  line-height: 1.7;
}

.login-setup__ready-icon {
  display: grid;
  width: 52px;
  height: 52px;
  place-items: center;
  color: #fff;
  font-size: 24px;
  border-radius: 50%;
  background: #2f80ed;
}

.login-setup__wizard-footer {
  position: fixed;
  right: 14px;
  bottom: 16px;
  left: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
}

.login-setup__back-link,
.login-setup__ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #252525;
  font: inherit;
  font-size: 14px;
  border: 0;
  background: transparent;
  cursor: pointer;
}

.login-setup__back-link {
  gap: 8px;
  padding: 0 4px;
  text-decoration: underline;
}

.login-setup__ghost {
  min-width: 130px;
  height: 46px;
  gap: 10px;
  color: #9b9b9b;
  font-weight: 700;
  border-radius: 23px;
  background: #fff;
}

.login-setup__footer-actions {
  display: flex;
  align-items: center;
  gap: 24px;
}

.login-setup__message {
  margin: 16px 0 0;
  padding: 10px 12px;
  box-sizing: border-box;
  color: #344054;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.45;
  border: 1px solid #d0d5dd;
  border-radius: 7px;
  background: #f8fafc;
}

.login-setup__message--error {
  color: #b42318;
  border-color: #fda29b;
  background: #fff1f0;
}

@media (max-height: 650px) {
  .login-setup--wizard .login-setup__shell {
    padding-top: 4px;
  }

  .login-setup--wizard .login-setup__mark {
    width: 62px;
    height: 44px;
  }

  .login-setup--wizard .login-setup__steps {
    margin-top: 16px;
  }

  .login-setup--wizard .login-setup__panel {
    min-height: 238px;
    padding-top: 20px;
  }
}
</style><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.login-setup__step span{font-family:"Segoe UI Symbol","Microsoft YaHei",sans-serif}</style></head><body><main class="login-setup login-setup--login"><header class="login-setup__chrome"><span class="login-setup__brand">Voice Assistant 安装向导</span><div class="login-setup__window-controls" aria-label="窗口控制"><button class="login-setup__window-button" type="button" aria-label="最小化"><span class="login-setup__window-button-minimize"></span></button><button class="login-setup__window-button login-setup__window-button--close" type="button" aria-label="关闭"><span class="login-setup__window-button-close"></span></button></div></header><section class="login-setup__shell" aria-live="polite"><ol class="login-setup__steps" aria-label="登录设置步骤"><li class="login-setup__step login-setup__step--current"><span>1</span>登录</li><li class="login-setup__step"><span>2</span>设置</li><li class="login-setup__step"><span>3</span>隐私</li><li class="login-setup__step"><span>4</span>就绪</li></ol><div class="login-setup__panel"><header class="login-setup__login-header"><h2>登录您的账号</h2><div class="login-setup__mode-tabs"><button class="login-setup__mode-tab" type="button">使用AD域登录</button></div></header><p class="login-setup__login-intro">使用邮箱 + 验证码快速登录，云端同步配置与历史。</p><div class="login-setup__form"><label class="login-setup__field"><span>电子邮箱</span><input type="email" placeholder="your@company.com"></label><label class="login-setup__field"><span>验证码</span><div class="login-setup__code-row"><input inputmode="numeric" placeholder="验证码"><button class="login-setup__secondary" type="button">发送验证码</button></div><small>请在160秒内输入验证码。</small></label></div><div class="login-setup__form-footer"><label class="login-setup__check"><input type="checkbox"><span>记住登录状态</span></label><button class="login-setup__primary" type="button"><span>登录</span><span class="login-setup__primary-arrow" aria-hidden="true">→</span></button></div></div></section></main></body></html>
