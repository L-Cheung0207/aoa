appId: com.voiceassistant.service
productName: Voice Assistant
electronVersion: 35.7.5
copyright: Copyright (c) 2026 Voice Assistant

directories:
  buildResources: installer-resources
  output: ../../release

files:
  - out/**/*
  - package.json
  - node_modules/**/*

extraResources:
  - from: resources/tray-icon.ico
    to: tray-icon.ico

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/tray-icon.ico

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Voice Assistant
  artifactName: "${productName} Setup ${version}.${ext}"
  include: installer.nsh
  runAfterFinish: false
