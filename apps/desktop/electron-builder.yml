appId: com.ctm.voice-assistant
productName: Voice Assistant
electronVersion: 35.7.5
copyright: Copyright (c) 2026 Voice Assistant

directories:
  buildResources: installer-resources
  output: dist-electron

electronDist: ../../node_modules/electron/dist
asar: true
npmRebuild: false

publish:
  provider: generic
  url: http://172.27.209.114:8097/aoa_api/

files:
  - out/**/*
  - package.json
  - "!node_modules/@voice/ai/**"
  - "!node_modules/@voice/shared/**"
  - "!node_modules/@voice/backend-client/**"
  - "!node_modules/@voice/db/**"

extraResources:
  - from: resources/app-icon.ico
    to: app-icon.ico
  - from: src/renderer/public/config.json
    to: config.json
  - from: ../../packages/native-helper/dist/voice_native_helper.node
    to: voice_native_helper.node

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/app-icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: Voice Assistant
  artifactName: "${productName} Setup ${version}.${ext}"
  include: installer.nsh
  installerLanguages:
    - zh_TW
  language: "1028"
  runAfterFinish: false
